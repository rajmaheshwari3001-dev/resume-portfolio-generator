<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Professional Portfolio of {{name}} - {{title}}. Discover my experience, projects, and skills.">
    <meta name="keywords" content="{{name}}, Portfolio, {{title}}, Resume, Projects, Skills">
    <meta name="author" content="{{name}}">
    <title>Portfolio | {{name}}</title>
    <!-- Modern Typography: Plus Jakarta Sans (body) and Space Grotesk (headings) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090B; /* Deep Obsidian */
            --card-bg: rgba(24, 24, 27, 0.7);
            --card-border: rgba(255, 255, 255, 0.05);
            --text-main: #FAFAFA;
            --text-muted: #A1A1AA;
            --accent: #06B6D4; /* Neon Cyan */
            --accent-dim: #6366F1; /* Indigo */
            --accent-glow: rgba(6, 182, 212, 0.3);
            --radius-lg: 24px;
            --radius-md: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            overflow-wrap: break-word;
            word-wrap: break-word;
        }

        body {
            background-color: var(--bg-color);
            background: 
                radial-gradient(circle at 15% 50%, rgba(var(--accent-color-rgb, 6, 182, 212), 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(99, 102, 241, 0.15), transparent 25%),
                linear-gradient(135deg, #111827 0%, #09090b 100%);
            background-attachment: fixed;
            color: var(--text-main);
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-auto-rows: minmax(100px, auto);
            gap: 1.5rem;
            max-width: 1200px;
            width: 100%;
        }

        /* Generic Card Styling */
        .bento-card {
            background-color: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes slideUpFade {
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bento-card:nth-child(1) { animation-delay: 0.1s; }
        .bento-card:nth-child(2) { animation-delay: 0.2s; }
        .bento-card:nth-child(3) { animation-delay: 0.3s; }
        .bento-card:nth-child(4) { animation-delay: 0.4s; }
        .bento-card:nth-child(5) { animation-delay: 0.5s; }
        .bento-card:nth-child(6) { animation-delay: 0.6s; }

        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px var(--accent-glow);
            border-color: rgba(6, 182, 212, 0.4);
        }

        .card-header {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* Hero Card (Spans 3 cols) */
        .card-hero {
            grid-column: span 3;
            grid-row: span 2;
            justify-content: center;
            background: linear-gradient(135deg, rgba(24, 24, 27, 0.8) 0%, rgba(99, 102, 241, 0.1) 100%);
            box-shadow: 0 0 40px rgba(99, 102, 241, 0.1);
        }
        
        .card-hero h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }
        
        .card-hero h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.5rem);
            color: var(--accent);
            font-weight: 400;
            margin-bottom: 1.5rem;
        }

        .card-hero p {
            color: var(--text-muted);
            font-size: 1.1rem;
            max-width: 80%;
            line-height: 1.6;
        }

        /* Contact Card (Spans 1 col) */
        .card-contact {
            grid-column: span 1;
            grid-row: span 2;
            justify-content: space-between;
        }
        
        .contact-item {
            margin-bottom: 1rem;
        }
        
        .contact-item span {
            display: block;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 0.25rem;
        }
        
        .contact-item a, .contact-item div {
            color: var(--text-main);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            word-break: break-word;
        }
        
        .contact-item a:hover {
            color: var(--accent);
        }

        /* Experience (Spans 2 cols) */
        .card-experience {
            grid-column: span 2;
            grid-row: span 2;
        }

        .job {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .job:hover {
            border-left-color: var(--accent);
            background: linear-gradient(90deg, rgba(255,255,255,0.03), transparent);
            transform: translateX(5px);
        }
        .job:last-child {
            margin-bottom: 0; padding-bottom: 0; border-bottom: none;
        }

        .job h3 { font-size: 1.25rem; margin-bottom: 0.25rem; }
        .job .duration { font-size: 0.85rem; color: var(--accent); margin-bottom: 0.75rem; display: block; font-weight: 500;}
        .job p { color: var(--text-muted); font-size: 0.95rem; line-height: 1.5;}

        /* Education (Spans 2 cols) */
        .card-education {
            grid-column: span 2;
            grid-row: span 1;
        }
        
        .education {
            margin-bottom: 1rem;
            padding-left: 0.5rem;
            border-left: 3px solid transparent;
            transition: all 0.3s ease;
        }
        .education:hover {
            border-left-color: rgba(6, 182, 212, 0.5);
            background: linear-gradient(90deg, rgba(6, 182, 212, 0.05), transparent);
            transform: translateX(5px);
        }
        .education h3 { font-size: 1.1rem; }
        .education .duration { font-size: 0.85rem; color: var(--text-muted); }

        /* Skills (Spans 4 cols, row flow) */
        .card-skills {
            grid-column: span 4;
        }
        
        .card-skills ul {
            display: flex;
            flex-wrap: wrap;
            gap: 0.75rem;
            list-style: none;
            padding: 0;
        }
        
        .card-skills li {
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #e0e7ff;
            padding: 0.6rem 1.25rem;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default;
            position: relative;
            overflow: hidden;
        }
        
        .card-skills li::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s ease;
        }

        .card-skills li:hover {
            background: rgba(99, 102, 241, 0.25);
            border-color: var(--accent-color, rgba(99, 102, 241, 0.8));
            box-shadow: 0 0 20px var(--accent-color, rgba(99, 102, 241, 0.4));
            transform: translateY(-2px) scale(1.05);
            color: #ffffff;
        }
        
        .card-skills li:hover::before {
            left: 100%;
        }

        /* Projects (Spans 4 cols) */
        .card-projects {
            grid-column: span 4;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 1.5rem;
            background: transparent;
            border: none;
            padding: 0;
        }

        .project {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--radius-lg);
            padding: 2rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .project:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px var(--accent-glow);
            border-color: rgba(6, 182, 212, 0.4);
        }

        .project h3 { font-size: 1.25rem; margin-bottom: 0.5rem; }
        .project p { color: var(--text-muted); font-size: 0.95rem; }

        /* Responsive */
        @media (max-width: 1200px) {
            .bento-grid { padding: 0 1rem; }
        }

        @media (max-width: 1024px) {
            .bento-grid { grid-template-columns: repeat(2, 1fr); }
            .card-hero, .card-experience, .card-education, .card-contact, .card-skills, .card-projects { grid-column: span 2; }
            .card-contact { grid-row: span 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
            .card-projects { grid-template-columns: 1fr; }
        }

        @media (max-width: 768px) {
            .bento-grid { grid-template-columns: 1fr; gap: 1rem; }
            .bento-card, .card-hero, .card-contact, .card-experience, .card-education, .card-skills, .card-projects {
                grid-column: span 1;
            }
            .card-contact { grid-template-columns: 1fr; }
            body { padding: 1rem; }
            .bento-card { padding: 1.5rem; }
            .project { padding: 1.5rem; }
            
            .job p, .project p, .card-hero p {
                font-size: 1rem; /* Better readability on mobile */
                line-height: 1.6;
            }
        }
        
        @media (max-width: 480px) {
            body { padding: 0.5rem; }
            .bento-grid { gap: 0.75rem; }
            .bento-card { padding: 1.25rem; border-radius: 20px;}
            .project { padding: 1.25rem; border-radius: 16px;}
            .card-skills li { font-size: 0.85rem; padding: 0.5rem 1rem; }
            .card-hero h1 { font-size: clamp(2rem, 8vw, 2.5rem); }
            .card-hero h2 { font-size: clamp(1.1rem, 5vw, 1.3rem); }
            .job h3, .project h3, .education h3 { font-size: 1.1rem; }
        }

        /* --- THEME STYLES --- */
        
        /* 1. Minimal */
        .template-minimal body { background: #f8f9fa; color: #1e293b; }
        .template-minimal .bento-card, .template-minimal .project { 
            background: #ffffff; 
            border-color: rgba(0,0,0,0.05); 
            box-shadow: 0 4px 15px rgba(0,0,0,0.02); 
            color: #1e293b;
        }
        .template-minimal .card-hero { background: #f1f5f9; box-shadow: none; }
        .template-minimal .text-muted, .template-minimal .card-header { color: #64748b; }
        .template-minimal h1, .template-minimal h2, .template-minimal h3 { color: #0f172a; }
        .template-minimal .job p, .template-minimal .project p, .template-minimal .card-hero p { color: #475569; }
        .template-minimal .contact-item a { color: #0f172a; }
        .template-minimal .contact-item a:hover { color: var(--accent-color, #06B6D4); }
        .template-minimal .card-skills li { background: #f1f5f9; border-color: transparent; color: #334155; }
        .template-minimal .card-skills li:hover { background: #e2e8f0; border-color: transparent; }

        /* 2. Glassmorphism */
        .template-glassmorphism body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(var(--accent-color-rgb, 99,102,241), 0.35) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(var(--accent-color-rgb, 99,102,241), 0.35) 0%, transparent 50%);
            color: #ffffff;
        }
        .template-glassmorphism .bento-card, .template-glassmorphism .project {
            background-color: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            color: #ffffff;
        }
        .template-glassmorphism .bento-card:hover, .template-glassmorphism .project:hover {
            border-color: rgba(var(--accent-color-rgb, 255,255,255), 0.5);
            box-shadow: 0 15px 40px rgba(var(--accent-color-rgb, 255,255,255), 0.15);
        }
        .template-glassmorphism .card-hero { background: rgba(var(--accent-color-rgb, 255,255,255), 0.08); }
        .template-glassmorphism .text-muted, .template-glassmorphism .card-header { color: #cbd5e1; }
        .template-glassmorphism h1, .template-glassmorphism h2, .template-glassmorphism h3 { color: #ffffff; }
        .template-glassmorphism .job p, .template-glassmorphism .project p, .template-glassmorphism .card-hero p { color: #e2e8f0; }
        .template-glassmorphism .contact-item a { color: var(--accent-color, #60a5fa); }
        .template-glassmorphism .card-skills li { background: rgba(var(--accent-color-rgb, 255,255,255), 0.15); border-color: rgba(255,255,255,0.1); color: #fff; }

        /* 3. Cyberpunk */
        .template-cyberpunk body {
            background-color: #050505;
            background-image: 
                linear-gradient(rgba(var(--accent-color-rgb, 6, 182, 212), 0.15) 1px, transparent 1px),
                linear-gradient(90deg, rgba(var(--accent-color-rgb, 6, 182, 212), 0.15) 1px, transparent 1px);
            background-size: 30px 30px;
            color: #e2e8f0;
        }
        .template-cyberpunk .bento-card, .template-cyberpunk .project {
            background-color: rgba(5, 5, 5, 0.95);
            border: 1px solid var(--accent-color, #06b6d4);
            border-radius: 0;
            box-shadow: 4px 4px 0px var(--accent-color, #06b6d4);
            color: #e2e8f0;
        }
        .template-cyberpunk .bento-card:hover, .template-cyberpunk .project:hover {
            box-shadow: 6px 6px 0px var(--accent-color, #06b6d4);
            transform: translate(-2px, -2px);
        }
        .template-cyberpunk h1, .template-cyberpunk h2, .template-cyberpunk h3, .template-cyberpunk .card-header {
            font-family: 'Space Grotesk', monospace;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 8px var(--accent-color, #06b6d4);
            color: #ffffff;
        }
        .template-cyberpunk .text-muted, .template-cyberpunk .job p, .template-cyberpunk .project p, .template-cyberpunk .card-hero p { color: #94a3b8; }
        .template-cyberpunk .contact-item a { color: var(--accent-color, #06b6d4); }
        .template-cyberpunk .card-skills li {
            border-radius: 0; background: transparent; border-color: var(--accent-color, #06b6d4); color: #fff;
            text-shadow: 0 0 5px var(--accent-color, #06b6d4);
        }

        /* 4. Neobrutalism */
        .template-neobrutalism body { background-color: #fdf5e6; color: #000000; }
        .template-neobrutalism .bento-card, .template-neobrutalism .project {
            background-color: #ffffff;
            border: 3px solid #000000;
            border-radius: 8px;
            box-shadow: 8px 8px 0px #000000;
            color: #000000;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .template-neobrutalism .bento-card:hover, .template-neobrutalism .project:hover {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0px #000000;
        }
        .template-neobrutalism .card-hero {
            background: var(--accent-color, #f59e0b);
            border-color: #000000;
        }
        .template-neobrutalism .card-hero h1, .template-neobrutalism .card-hero h2, .template-neobrutalism .card-hero p {
            color: #000000;
            text-shadow: 1px 1px 0px #ffffff, -1px -1px 0px #ffffff, 1px -1px 0px #ffffff, -1px 1px 0px #ffffff;
        }
        .template-neobrutalism h1, .template-neobrutalism h2, .template-neobrutalism h3, .template-neobrutalism .card-header { color: #000000; font-weight: 800; }
        .template-neobrutalism .text-muted, .template-neobrutalism .job p, .template-neobrutalism .project p { color: #111111; font-weight: 500; }
        .template-neobrutalism .contact-item a, .template-neobrutalism a { color: #000000; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; }
        .template-neobrutalism .card-skills li {
            background-color: #ffffff;
            color: #000000;
            border: 3px solid #000000;
            box-shadow: 4px 4px 0px #000000;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <main class="bento-grid" aria-label="Portfolio Grid">
        
        <!-- Hero Section -->
        <header class="bento-card card-hero" aria-label="Hero Section">
            <h1>{{name}}</h1>
            <h2>{{title}}</h2>
            {{about_section}}
        </header>

        <!-- Contact Section -->
        <section class="bento-card card-contact" aria-label="Contact Information">
            <div class="card-header">Contact</div>
            <div class="contact-links">
                <div class="contact-item">
                    <span>Email</span>
                    <a href="mailto:{{email}}">{{email}}</a>
                </div>
                {{phone_section}}
                {{links_section}}
            </div>
        </section>

        {{experience_section}}
        {{education_achievements_section}}
        {{skills_section}}
        {{projects_section}}

    </main>

</body>
</html>
