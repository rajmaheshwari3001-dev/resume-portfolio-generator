<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="AI-Assisted Resume Portfolio Generator. Instantly transform your unstructured resume text into a stunning, responsive, and glassmorphic personal portfolio using Google Gemini AI.">
    <meta name="keywords" content="Resume generator, AI portfolio, Gemini AI, resume to HTML, automated portfolio, tech portfolio builder">
    <meta name="author" content="Rajesh Kumar">
    <title>AI-Assisted Resume Portfolio Generator</title>
    <!-- Use premium geometric sans-serif fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>

    <!-- Dynamic Mesh Background -->
    <div class="mesh-bg">
        <div class="mesh-blob blob-1"></div>
        <div class="mesh-blob blob-2"></div>
        <div class="mesh-blob blob-3"></div>
    </div>

    <!-- Navbar -->
    <nav class="premium-nav">
        <div class="logo">
            <span class="logo-bold">Portfolio</span> Generator
        </div>
    </nav>

    <!-- Main App Container -->
    <div class="app-container">
        
        <!-- Left: Input Console -->
        <div class="console-panel glass-panel">
            <div class="panel-header">
                <span class="step-indicator">01</span>
                <h2>Upload Resume</h2>
            </div>
            
            <p class="panel-subtitle">Upload your resume.txt or paste your resume text below to generate your portfolio.</p>

            <div class="upload-zone magnetic-zone" id="drop-zone">
                <input type="file" id="file-input" accept=".txt" hidden>
                <div class="upload-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="17 8 12 3 7 8"/>
                        <line x1="12" y1="3" x2="12" y2="15"/>
                    </svg>
                </div>
                <span class="upload-title">Drop resume.txt here</span>
                <span class="upload-sub">or <button id="browse-btn" class="text-btn magnetic">Browse Files</button></span>
            </div>

            <div class="text-editor-container">
                <textarea id="resume-input" placeholder="Alternatively, paste your raw resume text here..."></textarea>
                <div class="editor-footer">
                    <span class="status-indicator" id="status-badge">
                        <span class="pulse-dot"></span> Awaiting Input
                    </span>
                </div>
            </div>

            <button id="generate-btn" class="action-btn magnetic-btn" disabled>
                <span class="btn-text">Generate Portfolio</span>
                <span class="loader" hidden></span>
            </button>
            <div id="error-message" class="error-toast" hidden></div>
        </div>

        <!-- Right: Preview Canvas -->
        <div class="canvas-panel glass-panel">
            <div class="panel-header canvas-header">
                <div class="header-left">
                    <span class="step-indicator">02</span>
                    <h2>Portfolio Preview</h2>
                </div>
                <button id="download-btn" class="download-btn magnetic" hidden>
                    <span>Download</span>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                        <polyline points="7 10 12 15 17 10"></polyline>
                        <line x1="12" y1="15" x2="12" y2="3"></line>
                    </svg>
                </button>
            </div>

            <div class="preview-stage" id="preview-container">
                <!-- Empty State -->
                <div class="stage-empty-state">
                    <div class="abstract-ring"></div>
                    <h3 class="abstract-title">No Portfolio Yet</h3>
                    <p class="abstract-desc">Upload data to generate.</p>
                </div>
                
                <!-- Iframe for injected HTML -->
                <iframe id="portfolio-frame" hidden></iframe>
            </div>
        </div>
    </div>

    </main>
    <!-- GSAP for insane animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
