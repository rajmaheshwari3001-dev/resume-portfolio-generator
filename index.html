<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="AI-Assisted Resume Portfolio Generator. Instantly transform your unstructured resume text into a stunning, responsive, and modern personal portfolio using AI.">
    <title>PORTFOLIO.AI - Create Your Premium Portfolio</title>
    <!-- Modern Typography: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Background Decor -->
    <div class="bg-glow blob-1"></div>
    <div class="bg-glow blob-2"></div>
    <div class="bg-grid"></div>

    <!-- Navigation -->
    <nav class="navbar">
        <div class="logo">
            <span class="logo-bold">PORTFOLIO</span><span class="logo-accent">.AI</span>
        </div>
        <div class="nav-links">
            <a href="https://github.com" target="_blank" class="nav-icon" title="GitHub">
                <i data-lucide="github"></i>
            </a>
        </div>
    </nav>

    <!-- Main Content Grid -->
    <main class="app-grid">

        <!-- Left Column: Input -->
        <section class="input-section bento-card">
            <div class="hero-content">
                <div class="badge">AI-Powered</div>
                <h1 class="hero-title">Your resume.<br><span class="gradient-text">Reimagined.</span></h1>
                <p class="hero-desc">Upload your resume to generate a beautifully crafted, highly professional portfolio
                    in seconds.</p>
            </div>

            <div class="upload-zone" id="drop-zone">
                <input type="file" id="file-input" accept=".txt" hidden>
                <div class="upload-icon-wrapper">
                    <i data-lucide="upload-cloud"></i>
                </div>
                <h3 class="upload-title">Drop your resume.txt here</h3>
                <p class="upload-sub">or <button id="browse-btn" class="text-btn">Browse files</button></p>
            </div>

            <div class="editor-box">
                <div class="editor-header">
                    <span><i data-lucide="file-text" class="sm-icon"></i> Raw Text</span>
                    <span class="status-indicator" id="status-badge">
                        <span class="dot"></span> Awaiting Input
                    </span>
                </div>
                <textarea id="resume-input" placeholder="Alternatively, paste your raw resume text here..."></textarea>
            </div>

            <button id="generate-btn" class="primary-btn" disabled>
                <span class="btn-text">Generate Portfolio</span>
                <i data-lucide="sparkles" class="btn-icon"></i>
                <span class="loader" hidden></span>
            </button>
            <div id="error-message" class="error-toast" hidden></div>
        </section>

        <!-- Right Column: Preview -->
        <section class="preview-section bento-card">
            <div class="preview-header">
                <div class="header-info">
                    <span class="step-num">02</span>
                    <h2>Live Preview</h2>
                </div>
                <button id="download-btn" class="secondary-btn" hidden>
                    <i data-lucide="download"></i> Download
                </button>
            </div>

            <div class="preview-container" id="preview-container">
                <!-- Empty State -->
                <div class="empty-state">
                    <div class="empty-icon">
                        <i data-lucide="layout"></i>
                    </div>
                    <h3>No Data Provided</h3>
                    <p>Upload a resume to see the magic happen.</p>
                </div>

                <!-- Iframe for generated portfolio -->
                <iframe id="portfolio-frame" hidden></iframe>
            </div>
        </section>

    </main>

    <!-- Scripts -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
